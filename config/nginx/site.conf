# HSTS: Traefik termina TLS e encaminha por HTTP, entao $scheme seria sempre "http".
# Usa X-Forwarded-Proto (enviado pelo Traefik); sem header (dev direto), nao emite HSTS.
map $http_x_forwarded_proto $hsts_header {
    default "";
    https   "max-age=31536000; includeSubDomains";
}
map $http_x_forwarded_proto $tf_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name rubbleapp.duckdns.org;

    root /var/www/html;
    index index.html;

    server_tokens off;
    client_max_body_size 25M;

    # ── Security: paths to block ──
    location = /.env               { deny all; return 403; }
    location = /composer.json      { deny all; return 403; }
    location = /composer.lock      { deny all; return 403; }
    location = /composer.phar      { deny all; return 403; }
    location = /package.json       { deny all; return 403; }
    location = /bun.lock           { deny all; return 403; }
    location = /bunfig.toml        { deny all; return 403; }
    location = /phpunit.xml        { deny all; return 403; }
    location = /tsconfig.json      { deny all; return 403; }
    location ^~ /vendor/           { deny all; return 403; }
    location ^~ /node_modules/     { deny all; return 403; }
    location ^~ /tests/            { deny all; return 403; }
    location ^~ /OS/               { deny all; return 403; }
    location ^~ /LAUDO/            { deny all; return 403; }
    location ^~ /cache/            { deny all; return 403; }
    location ^~ /config/           { deny all; return 403; }
    location ^~ /storage/          { deny all; return 403; }
    location ^~ /docs/             { deny all; return 403; }
    location ^~ /tempo_fechado/    { deny all; return 403; }
    location ^~ /controle-combustivel-volante/ { deny all; return 403; }
    location ^~ /rubble-pdf-checker/           { deny all; return 403; }
    location ^~ /app/api/           { deny all; return 403; }
    location ~* /Dockerfile(\..*)?$ { deny all; return 403; }
    # Dotfiles (.git/, .env.*, .vscode/, .opencode/, ...) — /.well-known is excepted
    location ~ /\.(?!well-known/)  { deny all; return 403; }
    # Dumps e dados sensiveis por extensao (db.sql, *.csv, *.xlsx, AGENTS.md, ...)
    location ~* \.(sql|csv|xlsx|xls|bak|old|log|md|sh|yml|yaml|lock|ini|conf)$ {
        deny all;
        return 403;
    }

    # ── Tempo Fechado proxy (antes do SPA fallback) ──
    location ^~ /tempo-fechado/ {
        proxy_pass http://tempo-fechado:5050/;
        proxy_redirect / /tempo-fechado/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tf_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 250M;
    }

    # ── Controle de Combustível Volante proxy ──
    # Bloqueia o painel administrativo interno do PocketBase contra acesso externo
    location ^~ /combustivel/_/ {
        deny all;
        return 403;
    }

    location ^~ /combustivel/ {
        proxy_pass http://controle-combustivel:8090/;
        proxy_redirect / /combustivel/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tf_forwarded_proto;
        proxy_set_header Authorization $http_authorization;

        # Suporte a Server-Sent Events (SSE / Realtime PocketBase) e WebSockets sem buffering
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        chunked_transfer_encoding off;
        client_max_body_size 25M;
    }

    # ── API: única entrada PHP ──
    location ^~ /app/api/index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param QUERY_STRING     $query_string;
        fastcgi_read_timeout 120s;
        client_max_body_size 25M;
    }

    # ── Block any other .php file ──
    location ~ \.php$ {
        deny all;
        return 403;
    }

    # ── Tempo Fechado static (login sem prefixo usa /static/ absoluto) ──
    location ^~ /static/ {
        proxy_pass http://tempo-fechado:5050/static/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # ── Static assets with cache ──
    # ATENCAO: add_header em um nivel cancela a heranca dos headers do server.
    # Repetir os headers de seguranca em todo location que declara add_header.
    location /public/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
    location /image/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
    location /app/Views/ {
        expires 1h;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # ── SPA fallback (no-cache for index.html) ──
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $hsts_header always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip ──
    gzip on;
    gzip_types application/json text/plain text/css text/javascript application/javascript image/svg+xml;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
}

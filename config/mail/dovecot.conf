# Rubble PV approval mail receiver (Dovecot) — standalone config
protocols = imap
ssl = no
disable_plaintext_auth = no
# Não anunciar AUTH=PLAIN em conexão insegura: evita o notice
# "insecure server advertised AUTH=PLAIN" do libc-client no PHP imap.
# c-client faz fallback para o comando LOGIN, que o Dovecot aceita.
auth_mechanisms = LOGIN

log_path = /var/log/dovecot.log
info_log_path = /var/log/dovecot.log
auth_verbose = yes
mail_debug = no

first_valid_uid = 5000
last_valid_uid = 5000

mail_location = maildir:/var/mail/vhosts/%d/%n
mail_uid = 5000
mail_gid = 5000

passdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
}

userdb {
  driver = static
  args = uid=5000 gid=5000 home=/var/mail/vhosts/%d/%n
}

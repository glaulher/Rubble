<div class="min-h-screen dark-gradient" style="background: linear-gradient(90deg, #b9abd9 0%, #d8e7fd 50%, #fde1f0 100%);">
  <!-- SUB-HEADER -->
  <div class="bg-slate-900 text-white shadow-lg">
    <div class="px-6 py-2 grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-0 items-center">
      <div>
        <h1 class="text-2xl font-light tracking-[0.1em]">Inventário &amp; Custódia</h1>
        <p class="text-sm text-slate-400/80 mt-0.5">Controle de materiais, ferramentas, celulares e veículos em posse dos técnicos</p>
      </div>

      <div class="text-center">
        <span class="inline-flex items-center justify-center bg-blue-500/20 text-blue-300 px-3 py-1 rounded-xl text-xs font-semibold">
          <span id="inventoryCounter">0</span>
          <span class="ml-1" id="inventoryCounterLabel">em campo</span>
        </span>
      </div>

      <div class="text-right flex items-center justify-end gap-3">
        <button id="btnNewInventory" data-action="navigate-inventory-form"
          class="bg-emerald-300 hover:bg-emerald-400 active:bg-emerald-500 text-emerald-800 px-4 py-2 rounded-xl text-sm font-medium transition cursor-pointer whitespace-nowrap">
          + Novo Item
        </button>
      </div>
    </div>
  </div>

  <!-- FILTER BAR -->
  <div class="px-4 py-3 flex flex-wrap gap-4 items-center justify-between bg-white dark:bg-[#1a1f2e] rounded-2xl shadow-sm border border-slate-200 dark:border-[#2d3548] mx-6 mt-4">
    <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto">
      <!-- Search Input -->
      <div class="relative flex-1 sm:flex-none">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="inventorySearchInput" placeholder="Buscar por técnico, material, modelo ou serial..."
          class="w-full sm:w-80 rounded-xl border border-slate-300 dark:border-[#3b4459] bg-white dark:bg-[#131824] text-slate-800 dark:text-white placeholder-slate-400 pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          aria-label="Buscar no inventário" />
      </div>

      <!-- Status Filter Pills -->
      <div class="inline-flex rounded-xl p-1 bg-slate-100 dark:bg-[#131824] border border-slate-200 dark:border-slate-700 text-xs font-medium" id="inventoryStatusPills">
        <button type="button" data-status="" class="status-pill px-3 py-1.5 rounded-lg transition bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm font-semibold cursor-pointer">
          Todos
        </button>
        <button type="button" data-status="em_posse" class="status-pill px-3 py-1.5 rounded-lg transition text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white cursor-pointer">
          Em posse
        </button>
        <button type="button" data-status="devolvido" class="status-pill px-3 py-1.5 rounded-lg transition text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white cursor-pointer">
          Devolvido
        </button>
      </div>

      <!-- Category Filter -->
      <div class="flex items-center gap-2">
        <label for="inventoryCategoryFilter" class="text-xs text-slate-500 dark:text-slate-400 font-medium">Categoria:</label>
        <select id="inventoryCategoryFilter"
          class="rounded-xl border border-slate-300 dark:border-[#3b4459] bg-white dark:bg-[#131824] text-slate-800 dark:text-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
          <option value="">Todas as categorias</option>
          <option value="veiculo">Veículos</option>
          <option value="ferramenta">Ferramentas</option>
          <option value="celular_ti">Celular / TI</option>
          <option value="equipamento">Equipamentos</option>
          <option value="outros">Outros</option>
        </select>
      </div>
    </div>
  </div>

  <!-- TABLE CONTENT -->
  <div class="p-6">
    <div class="bg-white dark:bg-[#1a1f2e] rounded-3xl shadow-xl border border-slate-200 dark:border-[#2d3548] overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="bg-slate-100 dark:bg-slate-800/60 text-slate-600 dark:text-slate-300 uppercase text-xs tracking-wider border-b border-slate-200 dark:border-slate-700">
            <th class="text-left px-4 py-3 font-semibold">Categoria</th>
            <th class="text-left px-4 py-3 font-semibold">Material / Descrição</th>
            <th class="text-left px-4 py-3 font-semibold">Modelo</th>
            <th class="text-left px-4 py-3 font-semibold">Serial / Placa</th>
            <th class="text-left px-4 py-3 font-semibold">Técnico Responsável</th>
            <th class="text-left px-4 py-3 font-semibold whitespace-nowrap">Retirada</th>
            <th class="text-left px-4 py-3 font-semibold whitespace-nowrap">Devolução</th>
            <th class="text-center px-4 py-3 font-semibold whitespace-nowrap">Status</th>
            <th class="text-right px-4 py-3 font-semibold w-24">Ações</th>
          </tr>
        </thead>
        <tbody id="inventoryTableBody" class="divide-y divide-slate-100 dark:divide-slate-800"></tbody>
      </table>
    </div>

    <div id="inventoryEmpty" class="hidden text-center py-12 text-slate-400 dark:text-slate-500">
      Nenhum item encontrado no inventário
    </div>

    <div id="inventoryLoading" class="hidden text-center py-8">
      <span class="text-slate-400">Carregando...</span>
    </div>

    <div id="sentinel" class="h-4"></div>
  </div>
</div>

<div class="min-h-screen dark-gradient" style="background: linear-gradient(90deg, #b9abd9 0%, #d8e7fd 50%, #fde1f0 100%);">
  <!-- SUB-HEADER (Padrão exato de PV) -->
  <div class="bg-slate-900 text-white shadow-lg">
    <div class="px-6 py-2 grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-0 items-center">
      <div>
        <h1 class="text-2xl font-light tracking-[0.1em]">Inventário &amp; Custódia</h1>
        <p class="text-sm text-slate-400/80 mt-0.5">Controle de materiais, ferramentas, celulares e veículos em posse dos técnicos</p>
      </div>

      <div class="text-center self-center">
        <span class="inline-flex items-center justify-center bg-blue-500/20 text-blue-300 px-3 py-1 rounded-xl text-xs font-semibold">
          <span id="inventoryCounter">0</span>
          <span class="ml-1" id="inventoryCounterLabel">em campo</span>
        </span>
      </div>

      <!-- BOTÕES DE AÇÃO DO SUB-HEADER (Ícones com tooltip estilo Atividade Planejada) -->
      <div class="text-right flex items-center justify-end gap-3">
        <!-- Cautelas -->
        <button id="btnHistoryTermos" data-action="open-termos-history"
          class="bg-slate-300 hover:bg-slate-400 active:bg-slate-500 text-slate-900 p-2 rounded-xl relative group cursor-pointer transition"
          aria-label="Histórico de Cautelas">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
            <path d="M9 12h6"/>
            <path d="M9 16h6"/>
          </svg>
          <span class="absolute right-0 top-[54px] scale-0 group-hover:scale-100 origin-top-right transition-transform duration-200 bg-slate-900 text-white text-xs px-3 py-2 rounded-lg whitespace-nowrap shadow-lg border border-slate-600 z-50">Histórico de Cautelas</span>
        </button>

        <!-- Novo Termo -->
        <button id="btnNewTermoCautela" data-action="open-termo-modal"
          class="bg-sky-300 hover:bg-sky-400 active:bg-sky-500 text-sky-800 p-2 rounded-xl relative group cursor-pointer transition"
          aria-label="Novo Termo de Cautela">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
          <span class="absolute right-0 top-[54px] scale-0 group-hover:scale-100 origin-top-right transition-transform duration-200 bg-slate-900 text-white text-xs px-3 py-2 rounded-lg whitespace-nowrap shadow-lg border border-slate-600 z-50">Novo Termo de Cautela</span>
        </button>

        <!-- Novo Item -->
        <button id="btnNewInventory" data-action="navigate-inventory-form"
          class="bg-emerald-300 hover:bg-emerald-400 active:bg-emerald-500 text-emerald-800 p-2 rounded-xl relative group cursor-pointer transition"
          aria-label="+ Novo Item">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span class="absolute right-0 top-[54px] scale-0 group-hover:scale-100 origin-top-right transition-transform duration-200 bg-slate-900 text-white text-xs px-3 py-2 rounded-lg whitespace-nowrap shadow-lg border border-slate-600 z-50">+ Novo Item</span>
        </button>
      </div>
    </div>
  </div>

  <main class="max-w-[96rem] mx-auto px-4 sm:px-6 py-8">
    <!-- FILTROS (Exatamente igual à tela de PV) -->
    <div class="flex flex-col md:flex-row gap-4 mb-6">
      <select id="inventoryStatusFilter"
        aria-label="Filtrar por status"
        class="rounded-xl border border-slate-300 dark:border-[#3b4459] px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-100 bg-white dark:bg-[#1a1f2e] text-slate-800 dark:text-slate-200 text-sm cursor-pointer shadow-xs">
        <option value="">Todos os status</option>
        <option value="em_posse">Em posse</option>
        <option value="devolvido">Devolvido</option>
      </select>

      <input
        type="text"
        id="inventorySearchInput"
        placeholder="Buscar por material, modelo, serial/placa, técnico..."
        aria-label="Buscar no inventário"
        class="flex-1 rounded-xl border border-slate-300 dark:border-[#3b4459] px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-100 bg-white dark:bg-[#1a1f2e] text-slate-800 dark:text-slate-200 dark:placeholder-slate-400 text-sm"
      />

      <select id="inventoryCategoryFilter"
        aria-label="Filtrar por categoria"
        class="rounded-xl border border-slate-300 dark:border-[#3b4459] px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-100 bg-white dark:bg-[#1a1f2e] text-slate-800 dark:text-slate-200 text-sm cursor-pointer shadow-xs">
        <option value="">Todas as categorias</option>
        <option value="veiculo">Veículos</option>
        <option value="ferramenta">Ferramentas</option>
        <option value="celular_ti">Celular / TI</option>
        <option value="equipamento">Equipamentos</option>
        <option value="outros">Outros</option>
      </select>

      <div class="relative group">
        <button
          id="btnInventoryCsv"
          data-action="generate-csv"
          class="bg-emerald-300 hover:bg-emerald-400 active:bg-emerald-500 text-emerald-800 px-3 py-2.5 rounded-xl font-semibold transition cursor-pointer"
          aria-label="Gerar relatório CSV"
        >
          <svg
            class="w-7 h-7"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
            />
            <polyline points="14 2 14 8 20 8" />
            <line x1="7" y1="12.5" x2="17" y2="12.5" />
            <line x1="7" y1="16.5" x2="17" y2="16.5" />
            <line x1="7" y1="8.5" x2="9" y2="8.5" />
          </svg>
        </button>
        <span
          class="absolute right-0 top-[54px] scale-0 group-hover:scale-100 origin-top-right transition-transform duration-200 bg-slate-900 text-white text-xs px-3 py-2 rounded-lg whitespace-nowrap shadow-lg border border-slate-600 z-50"
        >
          Gerar relatório CSV
        </span>
      </div>

      <div class="hidden" id="inventoryStatusPills">
        <button type="button" data-status="" class="status-pill">Todos</button>
        <button type="button" data-status="em_posse" class="status-pill">Em posse</button>
        <button type="button" data-status="devolvido" class="status-pill">Devolvido</button>
      </div>
    </div>

    <!-- TABELA (Idêntica à tabela de PV) -->
    <div class="bg-white dark:bg-[#1a1f2e] rounded-2xl shadow-sm border border-slate-200 dark:border-[#2d3548] overflow-hidden">
      <div class="overflow-x-auto">
        <table id="inventoryTable" class="w-full">
          <thead class="bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-700">
            <tr>
              <th class="w-10 px-3 py-3 text-center text-sm font-semibold text-slate-600 dark:text-slate-300">
                <input type="checkbox" id="checkAllInventory" aria-label="Selecionar todos os itens" class="rounded border-slate-300 dark:border-slate-600 text-blue-600 focus:ring-blue-500 cursor-pointer" title="Selecionar todos" />
              </th>
              <th class="text-left px-4 py-3 text-sm font-semibold text-slate-600 dark:text-slate-300 whitespace-nowrap">Categoria</th>
              <th class="text-left px-4 py-3 text-sm font-semibold text-slate-600 dark:text-slate-300 whitespace-nowrap">Material / Descrição</th>
              <th class="text-left px-4 py-3 text-sm font-semibold text-slate-600 dark:text-slate-300 whitespace-nowrap">Modelo</th>
              <th class="text-left px-4 py-3 text-sm font-semibold text-slate-600 dark:text-slate-300 whitespace-nowrap">Serial / Placa</th>
              <th class="text-left px-4 py-3 text-sm font-semibold text-slate-600 dark:text-slate-300 whitespace-nowrap">Técnico Responsável</th>
              <th class="text-left px-4 py-3 text-sm font-semibold text-slate-600 dark:text-slate-300 whitespace-nowrap">Retirada</th>
              <th class="text-left px-4 py-3 text-sm font-semibold text-slate-600 dark:text-slate-300 whitespace-nowrap">Devolução</th>
              <th class="text-center px-4 py-3 text-sm font-semibold text-slate-600 dark:text-slate-300 whitespace-nowrap">Status</th>
              <th class="text-right px-4 py-3 text-sm font-semibold text-slate-600 dark:text-slate-300 whitespace-nowrap w-28">Ações</th>
            </tr>
          </thead>
          <tbody id="inventoryTableBody"></tbody>
        </table>
      </div>

      <div id="inventoryEmpty" class="hidden p-10 text-center text-slate-500 dark:text-slate-400">
        Nenhum item encontrado no inventário
      </div>

      <div id="inventoryLoading" class="hidden text-center py-8">
        <span class="text-slate-400">Carregando...</span>
      </div>
    </div>

    <div id="sentinel" class="h-10"></div>
  </main>
</div>

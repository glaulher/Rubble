<div class="min-h-screen dark-gradient" style="background: linear-gradient(90deg, #b9abd9 0%, #d8e7fd 50%, #fde1f0 100%);">
  <div class="bg-slate-900 text-white shadow-lg">
    <div class="px-6 py-2 grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-0 items-center">
      <div>
        <h1 class="text-2xl font-light tracking-[0.1em]">Equipes</h1>
        <p class="text-sm text-slate-400/80 mt-0.5">Gerenciamento de equipes</p>
      </div>

      <div class="text-center">
        <span class="inline-flex items-center justify-center bg-blue-500/20 text-blue-300 px-3 py-1 rounded-xl text-xs font-semibold">
          <span id="teamCounter">0</span>
          <span class="ml-1">equipes</span>
        </span>
      </div>

      <div class="text-right flex items-center justify-end gap-3">
        <input type="text" id="teamSearchInput"
          class="w-full sm:w-44 rounded-xl border border-slate-600 bg-slate-800 text-white placeholder-slate-400 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Buscar..." aria-label="Buscar equipes" />
        <button data-action="open-team-modal-create"
          class="bg-emerald-300 hover:bg-emerald-400 active:bg-emerald-500 text-emerald-800 px-4 py-2 rounded-xl text-sm font-medium transition whitespace-nowrap">
          + Nova Equipe
        </button>
      </div>
    </div>
  </div>

  <div class="p-6">
    <div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
      <table class="w-full text-sm">
        <thead>
          <tr class="bg-slate-100 text-slate-600 uppercase text-xs tracking-wider">
            <th class="text-left px-6 py-4 font-semibold">Nome</th>
            <th class="text-left px-6 py-4 font-semibold">Status</th>
            <th class="hidden md:table-cell text-left px-6 py-4 font-semibold">Criado em</th>
            <th class="text-right px-6 py-4 font-semibold">Ações</th>
          </tr>
        </thead>
        <tbody id="teamTableBody" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>

    <div id="teamEmpty" class="hidden text-center py-12 text-slate-400">
      Nenhuma equipe encontrada
    </div>
  </div>

  <!-- Modal de criação/edição -->
  <div id="teamModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md">
      <div class="px-6 py-4 border-b border-slate-100">
        <h2 id="teamModalTitle" class="text-lg font-semibold text-slate-800">Nova Equipe</h2>
      </div>
      <div class="px-6 py-4 space-y-4">
        <input type="hidden" id="teamModalId" value="" />
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Nome *</label>
          <input type="text" id="teamModalNome" maxlength="100"
            class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
            placeholder="Ex: Equipe Alpha" />
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="teamModalAtivo" checked class="rounded" />
          <label for="teamModalAtivo" class="text-sm text-slate-700">Ativo</label>
        </div>
      </div>
      <div class="px-6 py-4 border-t border-slate-100 flex justify-end gap-3">
        <button data-action="close-team-modal"
          class="bg-slate-300 hover:bg-slate-400 active:bg-slate-500 text-slate-900 px-4 py-2 rounded-xl text-sm font-medium transition">
          Cancelar
        </button>
        <button data-action="save-team"
          class="bg-blue-300 hover:bg-blue-400 active:bg-blue-500 text-blue-800 px-4 py-2 rounded-xl text-sm font-medium transition">
          Salvar
        </button>
      </div>
    </div>
  </div>
</div>

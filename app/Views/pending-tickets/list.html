<div class="p-6">
  <!-- Sub-header -->
  <div class="bg-slate-900 text-white shadow-lg rounded-2xl mb-6">
    <div class="px-6 py-2 grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-0 items-center">
      <div>
        <h1 class="text-2xl font-light tracking-[0.1em]">OS Pendentes</h1>
        <p class="text-sm text-slate-400/80 mt-0.5">Gerenciamento de tickets</p>
      </div>
      <div class="text-center self-center">
        <span class="inline-flex items-center justify-center bg-blue-500/20 text-blue-300 px-3 py-1 rounded-xl text-xs font-semibold">
          <span id="pendingBadge">0</span>
          <span class="ml-1">pendentes</span>
        </span>
      </div>
      <div class="flex items-center gap-4 justify-self-end self-start">
        <input
          id="pendingSearchInput"
          type="text"
          aria-label="Buscar OS pendentes"
          placeholder="Buscar OS, equipamento, site..."
          class="px-4 py-1.5 rounded-xl bg-slate-800 border border-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-slate-700 text-blue-200 w-60"
        />
      </div>
    </div>
  </div>

  <!-- Status filter -->
  <div class="flex items-center gap-2 mb-4">
    <button data-status="" class="pending-filter-btn px-3 py-1.5 rounded-full text-xs font-medium transition bg-sky-200 text-sky-800">Todos</button>
    <button data-status="pendente" class="pending-filter-btn px-3 py-1.5 rounded-full text-xs font-medium transition bg-slate-200 text-slate-700 hover:bg-slate-300">Pendente</button>
    <button data-status="planejado" class="pending-filter-btn px-3 py-1.5 rounded-full text-xs font-medium transition bg-slate-200 text-slate-700 hover:bg-slate-300">Planejado</button>
    <button data-status="em andamento" class="pending-filter-btn px-3 py-1.5 rounded-full text-xs font-medium transition bg-slate-200 text-slate-700 hover:bg-slate-300">Em andamento</button>
    <button data-status="projeto clean up" class="pending-filter-btn px-3 py-1.5 rounded-full text-xs font-medium transition bg-slate-200 text-slate-700 hover:bg-slate-300">Clean up</button>
  </div>

  <!-- Table -->
  <div class="bg-white dark:bg-[#1a1f2e] rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
    <table class="w-full">
      <thead>
        <tr class="bg-slate-50 dark:bg-slate-800/50 text-left">
          <th class="px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Site</th>
          <th class="px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Equipamento</th>
          <th class="px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">OS</th>
          <th class="px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Status</th>
          <th class="px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Data</th>
        </tr>
      </thead>
      <tbody id="pendingTableBody"></tbody>
    </table>
    <div id="pendingEmpty" class="hidden text-center py-20 text-slate-500">
      <p class="text-lg">Nenhuma OS pendente encontrada.</p>
    </div>
  </div>

  <!-- Sentinel -->
  <div id="pendingSentinel" class="h-10"></div>
</div>

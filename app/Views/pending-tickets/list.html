<div
  class="min-h-screen dark-gradient"
  style="background: linear-gradient(90deg, #b9abd9 0%, #d8e7fd 50%, #fde1f0 100%);"
>
  <div class="bg-slate-900 text-white shadow-lg">
    <div class="px-6 py-2 grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-0 items-center">
      <div>
        <h1 class="text-2xl font-light tracking-[0.1em]">OS Pendentes</h1>
        <p class="text-sm text-slate-400/80 mt-0.5">Gerenciamento de tickets</p>
      </div>
      <div class="text-center self-center">
        <span class="inline-flex items-center justify-center bg-blue-500/20 text-blue-300 px-3 py-1 rounded-xl text-xs font-semibold">
          <span id="pendingBadge">0</span>
          <span class="ml-1">pendentes</span>
        </span>
      </div>
      <div class="flex items-center gap-4 justify-self-end self-start">
        <input
          id="pendingSearchInput"
          type="text"
          aria-label="Buscar OS pendentes"
          placeholder="Buscar..."
          class="px-4 py-1.5 rounded-xl bg-slate-800 border border-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-slate-700 text-blue-200 w-60"
        />
        <div class="relative group">
          <button
            id="pendingCsvBtn"
            data-action="generate-csv"
            class="bg-emerald-300 hover:bg-emerald-400 text-emerald-800 px-2 py-2 rounded-xl font-semibold transition"
          >
            <svg
              class="w-6 h-6"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <polyline points="14 2 14 8 20 8" />
              <line x1="8" y1="13" x2="16" y2="13" />
              <line x1="8" y1="17" x2="16" y2="17" />
              <line x1="8" y1="9" x2="10" y2="9" />
            </svg>
          </button>
          <span
            class="absolute right-0 top-[54px] scale-0 group-hover:scale-100 origin-top-right transition-transform duration-200 bg-slate-900 text-white text-xs px-3 py-2 rounded-lg whitespace-nowrap shadow-lg border border-slate-600 z-50"
          >
            Gerar relatório CSV
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- Status filter (radio) -->
  <div class="px-6 py-3 flex flex-wrap gap-4 items-end bg-white rounded-2xl shadow-sm border border-slate-200 mx-6 mt-4">
    <div class="flex items-end gap-3">
      <label class="text-sm text-slate-600 cursor-pointer flex items-center gap-1.5">
        <input type="radio" name="pendingFilter" value="" checked class="text-blue-600 focus:ring-blue-500 cursor-pointer" />
        Todos
      </label>
      <label class="text-sm text-slate-600 cursor-pointer flex items-center gap-1.5">
        <input type="radio" name="pendingFilter" value="pendente" class="text-blue-600 focus:ring-blue-500 cursor-pointer" />
        Pendente
      </label>
      <label class="text-sm text-slate-600 cursor-pointer flex items-center gap-1.5">
        <input type="radio" name="pendingFilter" value="planejado" class="text-blue-600 focus:ring-blue-500 cursor-pointer" />
        Planejado
      </label>
      <label class="text-sm text-slate-600 cursor-pointer flex items-center gap-1.5">
        <input type="radio" name="pendingFilter" value="em andamento" class="text-blue-600 focus:ring-blue-500 cursor-pointer" />
        Em andamento
      </label>
      <label class="text-sm text-slate-600 cursor-pointer flex items-center gap-1.5">
        <input type="radio" name="pendingFilter" value="projeto clean up" class="text-blue-600 focus:ring-blue-500 cursor-pointer" />
        Clean up
      </label>
    </div>
    <div class="flex items-end gap-2">
      <label for="pendingOsFilter" class="text-sm text-slate-600 whitespace-nowrap">OS</label>
      <input
        id="pendingOsFilter"
        type="text"
        aria-label="Filtrar por OS"
        placeholder="Filtrar por OS..."
        class="bg-white text-sm rounded-lg px-2 py-1.5 border border-slate-300 placeholder-slate-400 focus:outline-none focus:border-blue-500 text-slate-800 w-40"
      />
    </div>
    <div class="ml-auto flex items-center gap-2 relative shrink-0" id="pendingColContainer">
      <label class="text-sm text-slate-600 whitespace-nowrap">Colunas</label>
      <button
        type="button"
        id="pendingColBtn"
        class="bg-white text-sm rounded-lg px-2 py-1.5 border border-slate-300 focus:outline-none focus:border-blue-500 w-40 text-left flex items-center justify-between gap-1"
      >
        <span id="pendingColLabel" class="truncate">Todas</span>
        <svg class="w-4 h-4 shrink-0 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <div
        id="pendingColDropdown"
        class="hidden absolute top-full right-0 mt-1 w-56 bg-white border border-slate-200 rounded-xl shadow-lg z-50 max-h-60 overflow-y-auto"
      ></div>
    </div>
  </div>

  <main class="p-6 space-y-6">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <div id="pendingScrollContainer" class="max-h-[70vh] overflow-y-auto">
          <table id="pendingTable" class="w-full">
          <thead class="sticky top-0 z-10">
            <tr class="bg-slate-800 text-slate-100 text-left">
              <th data-sort="e.local" data-col="local" class="px-3 py-2.5 text-xs font-semibold tracking-wider whitespace-nowrap cursor-pointer select-none">Site <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="r.os" data-col="os" class="px-3 py-2.5 text-xs font-semibold tracking-wider whitespace-nowrap cursor-pointer select-none">OS <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="e.equipamento" data-col="equipamento" class="px-3 py-2.5 text-xs font-semibold tracking-wider whitespace-nowrap cursor-pointer select-none">Equipamento <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="e.localidade" data-col="localidade" class="px-3 py-2.5 text-xs font-semibold tracking-wider whitespace-nowrap cursor-pointer select-none">Localidade <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="r.tipo" data-col="tipo" class="px-3 py-2.5 text-xs font-semibold tracking-wider whitespace-nowrap cursor-pointer select-none">Categoria <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="r.status" data-col="status" class="px-3 py-2.5 text-xs font-semibold tracking-wider whitespace-nowrap cursor-pointer select-none">Status <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="r.prioridade" data-col="prioridade" class="px-3 py-2.5 text-xs font-semibold tracking-wider whitespace-nowrap cursor-pointer select-none">Prioridade <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="r.data" data-col="data" class="px-3 py-2.5 text-xs font-semibold tracking-wider whitespace-nowrap cursor-pointer select-none">Data Abertura <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="r.data_planejada" data-col="data_planejada" class="px-3 py-2.5 text-xs font-semibold tracking-wider whitespace-nowrap cursor-pointer select-none">Data Programada <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="r.data_real_inicio" data-col="data_real_inicio" class="px-3 py-2.5 text-xs font-semibold tracking-wider whitespace-nowrap cursor-pointer select-none">Data Real Início <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="r.data_prevista_conclusao" data-col="data_prevista_conclusao" class="px-3 py-2.5 text-xs font-semibold tracking-wider whitespace-nowrap cursor-pointer select-none">Data Prevista Conclusão <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="r.data_concluido" data-col="data_concluido" class="px-3 py-2.5 text-xs font-semibold tracking-wider whitespace-nowrap cursor-pointer select-none">Data Conclusão <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="r.equipe" data-col="equipe" class="px-3 py-2.5 text-xs font-semibold tracking-wider whitespace-nowrap cursor-pointer select-none">Técnico <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="r.material" data-col="material" class="px-3 py-2.5 text-xs font-semibold tracking-wider whitespace-nowrap cursor-pointer select-none">Material <span class="sort-icon text-slate-400"></span></th>
            </tr>
          </thead>
          <tbody id="pendingTableBody"></tbody>
          </table>
          <div id="pendingSentinel" class="h-10"></div>
        </div>
      </div>
      <div id="pendingEmpty" class="hidden text-center py-20 text-slate-500">
        <p class="text-lg">Nenhuma OS pendente encontrada.</p>
      </div>
    </div>
  </main>
</div>

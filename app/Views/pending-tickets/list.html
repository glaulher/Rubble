<div
  class="min-h-screen dark-gradient"
  style="background: linear-gradient(90deg, #b9abd9 0%, #d8e7fd 50%, #fde1f0 100%);"
>
  <div class="bg-slate-900 text-white shadow-lg">
    <div class="px-6 py-2 grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-0 items-center">
      <div>
        <h1 class="text-2xl font-light tracking-[0.1em]">OS Pendentes</h1>
        <p class="text-sm text-slate-400/80 mt-0.5">Gerenciamento de tickets</p>
      </div>
      <div class="text-center self-center">
        <span class="inline-flex items-center justify-center bg-blue-500/20 text-blue-300 px-3 py-1 rounded-xl text-xs font-semibold">
          <span id="pendingBadge">0</span>
          <span class="ml-1">pendentes</span>
        </span>
      </div>
      <div class="flex items-center gap-4 justify-self-end self-start">
        <input
          id="pendingSearchInput"
          type="text"
          aria-label="Buscar OS pendentes"
          placeholder="Buscar OS, equipamento, site..."
          class="px-4 py-1.5 rounded-xl bg-slate-800 border border-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-slate-700 text-blue-200 w-60"
        />
      </div>
    </div>
  </div>

  <!-- Action bar -->
  <div class="px-6 py-3 flex flex-wrap gap-2 items-center mx-6 mt-3">
    <button
      id="pendingRefreshBtn"
      type="button"
      data-role="admin coordenador supervisor administrativo cliente"
      class="px-4 py-2 rounded-xl text-sm font-semibold bg-emerald-200 hover:bg-emerald-300 text-emerald-800"
    >
      Atualizar
    </button>
    <button
      id="pendingCsvBtn"
      type="button"
      data-role="admin coordenador supervisor administrativo cliente"
      class="px-4 py-2 rounded-xl text-sm font-semibold bg-sky-200 hover:bg-sky-300 text-sky-800"
    >
      CSV
    </button>
    <div id="pendingCountCard" class="ml-auto inline-flex items-center gap-2 bg-white dark:bg-[#1a1f2e] rounded-xl px-4 py-2 border border-slate-200 dark:border-slate-700 text-sm text-slate-600 dark:text-slate-300">
      <span>OS Exibidas:</span>
      <span id="pendingCount" class="font-semibold text-slate-800 dark:text-slate-100">0</span>
    </div>
  </div>

  <!-- Status filter (radio) -->
  <div class="px-6 py-3 flex flex-wrap gap-4 items-end bg-white rounded-2xl shadow-sm border border-slate-200 mx-6 mt-1">
    <div class="flex items-end gap-3">
      <label class="text-sm text-slate-600 cursor-pointer flex items-center gap-1.5">
        <input type="radio" name="pendingFilter" value="" checked class="text-blue-600 focus:ring-blue-500 cursor-pointer" />
        Todos
      </label>
      <label class="text-sm text-slate-600 cursor-pointer flex items-center gap-1.5">
        <input type="radio" name="pendingFilter" value="pendente" class="text-blue-600 focus:ring-blue-500 cursor-pointer" />
        Pendente
      </label>
      <label class="text-sm text-slate-600 cursor-pointer flex items-center gap-1.5">
        <input type="radio" name="pendingFilter" value="planejado" class="text-blue-600 focus:ring-blue-500 cursor-pointer" />
        Planejado
      </label>
      <label class="text-sm text-slate-600 cursor-pointer flex items-center gap-1.5">
        <input type="radio" name="pendingFilter" value="em andamento" class="text-blue-600 focus:ring-blue-500 cursor-pointer" />
        Em andamento
      </label>
      <label class="text-sm text-slate-600 cursor-pointer flex items-center gap-1.5">
        <input type="radio" name="pendingFilter" value="projeto clean up" class="text-blue-600 focus:ring-blue-500 cursor-pointer" />
        Clean up
      </label>
    </div>
  </div>

  <main class="p-6 space-y-6">
    <div class="bg-white dark:bg-[#1a1f2e] rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
      <div class="overflow-x-auto">
        <div id="pendingScrollContainer" class="max-h-[70vh] overflow-y-auto">
          <table class="w-full">
          <thead class="sticky top-0 z-10">
            <tr class="bg-slate-800 text-slate-100 text-left">
              <th data-sort="e.local" class="px-3 py-2.5 text-xs font-semibold uppercase tracking-wider whitespace-nowrap cursor-pointer select-none">Site <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="r.os" class="px-3 py-2.5 text-xs font-semibold uppercase tracking-wider whitespace-nowrap cursor-pointer select-none">OS <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="e.equipamento" class="px-3 py-2.5 text-xs font-semibold uppercase tracking-wider whitespace-nowrap cursor-pointer select-none">Equipamento <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="r.tipo" class="px-3 py-2.5 text-xs font-semibold uppercase tracking-wider whitespace-nowrap cursor-pointer select-none">Categoria <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="r.status" class="px-3 py-2.5 text-xs font-semibold uppercase tracking-wider whitespace-nowrap cursor-pointer select-none">Status <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="r.data" class="px-3 py-2.5 text-xs font-semibold uppercase tracking-wider whitespace-nowrap cursor-pointer select-none">Data Abertura <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="r.data_planejada" class="px-3 py-2.5 text-xs font-semibold uppercase tracking-wider whitespace-nowrap cursor-pointer select-none">Data Programada <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="r.data_real_inicio" class="px-3 py-2.5 text-xs font-semibold uppercase tracking-wider whitespace-nowrap cursor-pointer select-none">Data Real Início <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="r.data_prevista_conclusao" class="px-3 py-2.5 text-xs font-semibold uppercase tracking-wider whitespace-nowrap cursor-pointer select-none">Data Prevista Conclusão <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="r.data_concluido" class="px-3 py-2.5 text-xs font-semibold uppercase tracking-wider whitespace-nowrap cursor-pointer select-none">Data Conclusão <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="r.equipe" class="px-3 py-2.5 text-xs font-semibold uppercase tracking-wider whitespace-nowrap cursor-pointer select-none">Técnico <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="r.material" class="px-3 py-2.5 text-xs font-semibold uppercase tracking-wider whitespace-nowrap cursor-pointer select-none">Material <span class="sort-icon text-slate-400"></span></th>
              <th data-sort="e.localidade" class="px-3 py-2.5 text-xs font-semibold uppercase tracking-wider whitespace-nowrap cursor-pointer select-none">Localidade <span class="sort-icon text-slate-400"></span></th>
            </tr>
          </thead>
          <tbody id="pendingTableBody"></tbody>
          </table>
          <div id="pendingSentinel" class="h-10"></div>
        </div>
      </div>
      <div id="pendingEmpty" class="hidden text-center py-20 text-slate-500">
        <p class="text-lg">Nenhuma OS pendente encontrada.</p>
      </div>
    </div>
  </main>
</div>
